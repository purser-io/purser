# Real, reputable HuggingFace models used as the negative (benign) set for the
# false-positive rate. These SHOULD scan clean (PASS/WARN); a FAIL/BLOCKED on any
# is a false positive to root-cause. `fetch_benign.py` resolves each `revision`
# to a commit SHA, pins it in benign_models.lock.json, and SKIPS any repo that is
# gated/removed — so this is a curated *candidate* list; the lock is the set that
# actually resolved. Kept heavily tiny (KB–low-MB) for fast, reproducible fetches,
# with a few real production models for realism.
#
# Coverage: pickle (.bin), safetensors, ONNX, Keras (.h5) across a broad sweep of
# architectures (encoders, decoders, seq2seq, vision, audio, multimodal). Real
# GGUF / TF SavedModel / CoreML negatives are scarce/large; the synthetic clean
# artifacts in kat.py cover those formats.
models:
  # ---- tiny multi-format fixtures (KB) --------------------------------------
  - { repo: hf-internal-testing/tiny-random-gpt2,                          revision: main, format: bin+h5+safetensors }
  - { repo: hf-internal-testing/tiny-random-bert,                          revision: main, format: bin+h5+onnx+safetensors }
  - { repo: hf-internal-testing/tiny-random-distilbert,                    revision: main, format: bin+h5 }
  - { repo: hf-internal-testing/tiny-random-t5,                            revision: main, format: bin+h5 }
  - { repo: hf-internal-testing/tiny-albert,                               revision: main, format: bin+h5 }

