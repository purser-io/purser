# Real, reputable HuggingFace models used as the negative (benign) set for the
# false-positive rate. These SHOULD scan clean (PASS/WARN); a FAIL/BLOCKED on any
# is a false positive to root-cause. Kept small/tiny for fast fetches — EXPAND
# this list (hundreds of models across formats) for a strong FPR estimate.
#
# `fetch_benign.py` resolves each `revision` to a commit SHA and pins it in
# benign_models.lock.json for reproducibility.
models:
  - { repo: hf-internal-testing/tiny-random-gpt2, revision: main, format: pytorch+safetensors }
  - { repo: hf-internal-testing/tiny-random-bert, revision: main, format: pytorch+safetensors }
  - { repo: hf-internal-testing/tiny-random-distilbert, revision: main, format: pytorch }
  - { repo: prajjwal1/bert-tiny, revision: main, format: pytorch }
  - { repo: google/bert_uncased_L-2_H-128_A-2, revision: main, format: pytorch }
  - { repo: sshleifer/tiny-gpt2, revision: main, format: pytorch }
  - { repo: hf-internal-testing/tiny-random-t5, revision: main, format: pytorch }
  - { repo: hf-internal-testing/tiny-random-RobertaModel, revision: main, format: safetensors }
