# Continuous integration: lint + test across the supported Python range,
# lockfile / license drift gates, Helm chart validation, and a no-push build of
# all three images (so a broken Dockerfile fails the PR, not the release).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The support range declared in pyproject (requires-python >=3.11).
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv + Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (dev + sign extras)
        run: |
          uv venv --clear
          uv pip install -e ".[dev,sign]"
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -q

  lockfiles:
    name: lockfile drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          # Pin uv: lockfile output is uv-version-specific, so this must match
          # the version used to generate the committed locks (see Makefile).
          version: "0.11.7"
      # Fails if requirements*.lock drift from pyproject.toml (supply-chain gate).
      - name: Verify lockfiles are current
        run: make lock-verify

  licenses:
    name: THIRD_PARTY_LICENSES drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      # gen_sbom.py resolves licenses from *installed* metadata, so every dep
      # must be present for the license lookup to succeed.
      - name: Install all extras
        run: |
          uv venv --clear
          uv pip install -e ".[dev,sign,hf,deep]"
      - name: Regenerate THIRD_PARTY_LICENSES.md
        run: uv run make licenses
      # Gate on the invariant that matters (all licenses resolved & permissive),
      # not a byte-for-byte diff that would be sensitive to the environment.
      - name: Assert every license resolved
        run: |
          if grep -qi 'UNKNOWN (see project)' THIRD_PARTY_LICENSES.md; then
            echo "::error::Unresolved dependency license in THIRD_PARTY_LICENSES.md:"
            grep -ni 'UNKNOWN (see project)' THIRD_PARTY_LICENSES.md
            exit 1
          fi
          echo "All dependency licenses resolved."

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint
        run: helm lint deploy/helm/purser
      - name: Render (defaults)
        run: helm template purser deploy/helm/purser > /dev/null
      - name: Render (all optional components)
        run: |
          helm template purser deploy/helm/purser \
            --set deep.enabled=true \
            --set hf.enabled=true \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set admission.enabled=true > /dev/null

  docker:
    name: docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core, file: Dockerfile }
          - { name: hf, file: Dockerfile.hf }
          - { name: deep, file: Dockerfile.deep }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Single-arch, loaded into the local daemon (no registry push on PRs) so
      # the Dockerfiles are exercised and the image can be vuln-scanned.
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: purser-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          # ignore-error: a GHA cache-export blip ("failed to solve:
          # not_found" after all layers built) must not fail the build —
          # the cache is an optimization, not a correctness gate.
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ matrix.name }}
      # A Trivy-clean image that cannot start is not a pass: the refresh bot
      # bumps apk and lockfile pins unattended, so prove the service boots.
      - name: Smoke test (${{ matrix.name }} starts and answers /healthz)
        run: scripts/smoke_image.sh purser-${{ matrix.name }}:ci

      # The vulnerability gate asks one question here: did THIS change add a
      # fixable HIGH/CRITICAL finding? Findings the base revision already has
      # are reported as a warning but do not fail the job — they appear when
      # upstream publishes a fix for something already pinned, which no PR
      # author can act on, and they used to turn every open PR red until the
      # pins were refreshed. "Is main clean today?" is answered daily by
      # wolfi-base-check.yml (which also opens the fix), and "may this ship?"
      # by the strict gate in release.yml.
      - name: Trivy scan (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: purser-${{ matrix.name }}:ci
          format: json
          output: trivy-head.json
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Report findings
        id: head
        run: |
          if python3 scripts/trivy_gate.py report trivy-head.json; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      # Only when there is something to attribute: build the base revision the
      # same way and scan it, so the gate can tell inherited from introduced.
      # Any failure to produce that baseline (first push, base no longer
      # builds) leaves no base report, and the gate then excuses nothing.
      - name: Check out the base revision
        if: steps.head.outputs.dirty == 'true'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .trivy-base
      - name: Build ${{ matrix.name }} at the base revision
        id: basebuild
        if: steps.head.outputs.dirty == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .trivy-base
          file: .trivy-base/${{ matrix.file }}
          push: false
          load: true
          tags: purser-${{ matrix.name }}:base
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Trivy scan of the base revision
        if: steps.head.outputs.dirty == 'true' && steps.basebuild.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: purser-${{ matrix.name }}:base
          format: json
          output: trivy-base.json
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Gate on findings this change introduces
        if: steps.head.outputs.dirty == 'true'
        run: |
          python3 scripts/trivy_gate.py diff \
            --base trivy-base.json --head trivy-head.json \
            --name "docker build (${{ matrix.name }})"
