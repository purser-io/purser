# Watches the Chainguard Wolfi base image. The Dockerfiles pin wolfi-base by
# digest for reproducibility; Chainguard rebuilds `:latest` frequently to pick
# up CVE fixes, so a static pin silently goes stale. Weekly this job compares the
# pin against the live index digest and, on drift, **auto-refreshes**: it bumps
# the pin in all three Dockerfiles, rebuilds each image, runs Trivy (the same
# HIGH/CRITICAL fixed-only gate as CI) on the new base, and opens a PR with the
# result. If the run itself errors, it falls back to opening an issue so drift is
# never silent. (Manual path: `make base-digest` still prints the live digest.)
#
# The digest is only half the pin: `apk add` resolves against the live Wolfi
# package repo, so the toolchain (python, pip, build-base) is pinned by version
# too and refreshed here as well — those versions can move without the digest
# moving, so that check runs every week regardless of digest drift. This is the
# update path for the apk pins; nothing in ci.yml gates on them, because live
# repo drift would otherwise fail unrelated PRs. (Manual path: `make apk-pins`.)
name: Wolfi base auto-refresh

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolfi-base-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the refresh branch
      pull-requests: write   # open/update the PR
      issues: write          # fallback issue if the run errors
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned vs live base digest
        id: check
        run: |
          set -euo pipefail
          pinned=$(grep -oE 'sha256:[a-f0-9]{64}' Dockerfile | head -1)
          token=$(curl -s "https://cgr.dev/token?scope=repository:chainguard/wolfi-base:pull" | jq -r .token)
          live=$(curl -sI \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://cgr.dev/v2/chainguard/wolfi-base/manifests/latest" \
            | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}')
          if [ -z "$pinned" ] || [ -z "$live" ]; then
            echo "could not resolve digests (pinned='$pinned' live='$live')" >&2
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "live=$live"     >> "$GITHUB_OUTPUT"
          echo "Pinned: $pinned"
          echo "Live:   $live"
          if [ "$pinned" = "$live" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Base image is current."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the digest pin in all Dockerfiles
        if: steps.check.outputs.drift == 'true'
        run: |
          set -euo pipefail
          for f in Dockerfile Dockerfile.hf Dockerfile.deep; do
            sed -i "s#${{ steps.check.outputs.pinned }}#${{ steps.check.outputs.live }}#g" "$f"
          done

      # The digest pin alone does not freeze the toolchain: `apk add` resolves
      # against the live Wolfi repo, so python/pip/build-base are pinned by
      # version too. Those can drift *without* the digest moving (Chainguard
      # publishes a package before rebuilding wolfi-base), so this runs
      # unconditionally — otherwise an apk-only security update would never
      # reach a PR.
      - name: Re-pin apk package versions
        id: apk
        run: |
          set -euo pipefail
          python3 scripts/repin_apk.py
          if git diff --quiet -- Dockerfile Dockerfile.hf Dockerfile.deep; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether anything drifted
        id: drift
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outputs.drift }}" = "true" ] \
             || [ "${{ steps.apk.outputs.drift }}" = "true" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          git --no-pager diff -- Dockerfile Dockerfile.hf Dockerfile.deep

      - name: Build all three images on the new base
        id: build
        if: steps.drift.outputs.any == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          rc=0
          docker build -t purser-core:refresh -f Dockerfile     . || rc=1
          docker build -t purser-hf:refresh   -f Dockerfile.hf   . || rc=1
          docker build -t purser-deep:refresh -f Dockerfile.deep . || rc=1
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Trivy — core
        id: tv_core
        if: steps.drift.outputs.any == 'true' && steps.build.outputs.rc == '0'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: purser-core:refresh
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Trivy — hf
        id: tv_hf
        if: steps.drift.outputs.any == 'true' && steps.build.outputs.rc == '0'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: purser-hf:refresh
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Trivy — deep
        id: tv_deep
        if: steps.drift.outputs.any == 'true' && steps.build.outputs.rc == '0'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: purser-deep:refresh
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Assemble PR body
        id: body
        if: steps.drift.outputs.any == 'true'
        run: |
          verdict() {
            case "$1" in
              success) echo "✅ build + Trivy clean" ;;
              failure) echo "⚠️ Trivy found fixable HIGH/CRITICAL — review" ;;
              *)       echo "— not scanned (image failed to build)" ;;
            esac
          }
          {
            echo "body<<PRBODY"
            if [ "${{ steps.check.outputs.drift }}" = "true" ]; then
              echo "Automated Wolfi base refresh — Chainguard rebuilt \`cgr.dev/chainguard/wolfi-base:latest\`, so the digest pin went stale."
              echo ""
              echo "| | digest |"
              echo "|---|---|"
              echo "| old (pinned) | \`${{ steps.check.outputs.pinned }}\` |"
              echo "| new (\`:latest\`) | \`${{ steps.check.outputs.live }}\` |"
            else
              echo "Automated Wolfi refresh — the base digest is unchanged (\`${{ steps.check.outputs.pinned }}\`), but the pinned **apk package versions** drifted: Chainguard published newer packages than the ones currently pinned."
            fi
            if [ "${{ steps.apk.outputs.drift }}" = "true" ]; then
              echo ""
              echo "apk version pins were refreshed — see the diff for the exact bumps."
            fi
            echo ""
            echo "**Build + Trivy on the new base** (HIGH/CRITICAL, fixed-only — same gate as CI):"
            echo "- core: $(verdict '${{ steps.tv_core.outcome }}')"
            echo "- hf:   $(verdict '${{ steps.tv_hf.outcome }}')"
            echo "- deep: $(verdict '${{ steps.tv_deep.outcome }}')"
            if [ "${{ steps.build.outputs.rc }}" != "0" ]; then
              echo ""
              echo "> ⚠️ One or more images **failed to build** on the new base — investigate before merging."
            fi
            echo ""
            echo "> Note: PRs opened by \`GITHUB_TOKEN\` do not trigger \`ci.yml\`, so the build + Trivy above is the authoritative gate. A maintainer can re-run CI (close/reopen the PR) before merge if desired."
            echo "PRBODY"
          } >> "$GITHUB_OUTPUT"

      - name: Open / update refresh PR
        id: cpr
        if: steps.drift.outputs.any == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Fine-grained PAT / App token (Contents + Pull requests: write) so the
          # bot can open the PR — the default GITHUB_TOKEN is blocked from
          # creating PRs on this repo, and a PAT-authored PR also triggers ci.yml.
          # Falls back to GITHUB_TOKEN if the secret isn't set yet (push works;
          # PR creation will fail visibly rather than silently).
          token: ${{ secrets.GH_PR_TOKEN || github.token }}
          branch: wolfi-base-refresh
          delete-branch: true
          add-paths: |
            Dockerfile
            Dockerfile.hf
            Dockerfile.deep
          commit-message: "build(deps): refresh wolfi-base pin (${{ steps.check.outputs.live }}) and apk version pins"
          signoff: true
          title: "build(deps): refresh Wolfi base image"
          labels: |
            wolfi-base
            dependencies
          body: ${{ steps.body.outputs.body }}

      # Self-cleaning: once a refresh PR is open (drift handled) or the base is
      # current again (PR merged), close any stale `wolfi-base` issue left by an
      # earlier run so drift state isn't tracked in two places.
      - name: Close stale drift issue
        if: >-
          always() &&
          (steps.drift.outputs.any == 'false' ||
           (steps.drift.outputs.any == 'true' && steps.cpr.outputs.pull-request-number))
        uses: actions/github-script@v9
        with:
          script: |
            const prUrl = "${{ steps.cpr.outputs.pull-request-url }}";
            const reason = prUrl
              ? `Superseded by the auto-refresh PR: ${prUrl}. Closing — the bump is tracked there.`
              : "Wolfi base is current again; closing this drift issue.";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "wolfi-base",
            });
            for (const issue of open.data) {
              // listForRepo returns PRs too (a PR is an issue in the API); the
              // refresh PR carries the `wolfi-base` label, so skip PRs or we'd
              // close our own PR.
              if (issue.pull_request) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: reason,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }

      - name: Fallback issue if the refresh run errored
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const pinned = "${{ steps.check.outputs.pinned }}" || "(unresolved)";
            const live   = "${{ steps.check.outputs.live }}"   || "(unresolved)";
            const title  = "Wolfi base auto-refresh failed";
            const run    = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The Wolfi base **auto-refresh** run errored — drift may be unhandled.",
              "",
              "| | digest |",
              "|---|---|",
              "| pinned (Dockerfiles) | `" + pinned + "` |",
              "| live `:latest` | `" + live + "` |",
              "",
              "Run log: " + run,
              "",
              "Fix manually if needed: bump the `ARG WOLFI=...@<digest>` line in " +
              "`Dockerfile`, `Dockerfile.hf`, and `Dockerfile.deep` to the live " +
              "digest (`make base-digest` prints it), then rebuild.",
            ].join("\n");
            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "wolfi-base",
            })).data.filter(i => !i.pull_request);   // exclude the refresh PR
            if (existing.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["wolfi-base", "security"],
              });
            }
